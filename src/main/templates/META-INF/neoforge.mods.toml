license="${mod_license}"
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="examplemod.png" #optional
# A text field displayed in the mod UI
#credits="" #optional
# The authors of the mod, displayed in the mod UI (optional)
#authors=""

description='''
Super Sargasso Sea mod - a dimension where lost things go

${mod_credits}
'''
enumExtensions="META-INF/enumextensions.json"

[[mixins]]
config="META-INF/${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="fusion"
type="required"
versionRange="[1.0.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="modonomicon"
type="required"
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"