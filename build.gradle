plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version '2.0.141'
	id 'idea'
	id 'com.diffplug.spotless' version '8.7.0'
}

import attribution.AttributionManifest

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets {
	datagen
	client
	main.resources {
		srcDir('src/generated/resources')

		exclude("**/*.bbmodel") // BlockBench project files
		exclude("**/*.xcf") // Gimp sources
		exclude("**/*.aseprite") // Aseprite sources
		exclude("**/*.aup3") // Audacity projects
		exclude("**/*.kra") // Krita docs
		exclude("src/generated/**/.cache") // datagen cache files
	}
}

repositories {
	maven {
		url 'https://github.com/psiegman/mvn-repo/raw/master/releases'
	}
	exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
	archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
	accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'
	version = project.neo_version

	addModdingDependenciesTo sourceSets.datagen
	addModdingDependenciesTo sourceSets.client
	
	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		data {
			clientData()
			sourceSet = sourceSets.datagen
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
			sourceSet(sourceSets.datagen)
			sourceSet(sourceSets.client)
		}
	}
}

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	clientImplementation sourceSets.main.output
	datagenImplementation sourceSets.client.output
	datagenImplementation sourceSets.main.output
	datagenImplementation 'nl.siegmann.epublib:epublib-core:3.1'
	datagenImplementation "maven.modrinth:modonomicon:${minecraft_version}-${modonomicon_version}"
	implementation "maven.modrinth:modonomicon:${minecraft_version}-${modonomicon_version}"
	datagenImplementation "maven.modrinth:fusion-connected-textures:${fusion_version}-neoforge-mc26.1"
	implementation "maven.modrinth:fusion-connected-textures:${fusion_version}-neoforge-mc26.1"
	clientImplementation "maven.modrinth:iris:1.11.3+26.1-neoforge"
	implementation "maven.modrinth:iris:1.11.3+26.1-neoforge"
	implementation "maven.modrinth:sodium:mc26.1.2-0.9.1-neoforge"
}

def mod_credits = AttributionManifest.credits(file("assets.yml"))
def mod_notices = AttributionManifest.thirdPartyNotices(file("assets.yml"), file("src/main/resources"))

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	inputs.property("mod_credits", mod_credits)

	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			neo_version            : neo_version,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_credits            : mod_credits,
			mod_notices            : mod_notices,
			modonomicon_version    : modonomicon_version,
			fusion_version         : fusion_version
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	dependsOn('spotlessApply')
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

spotless {
	java {
		importOrder()
		removeUnusedImports()

		eclipse()
			.configFile("spotless/eclipseformat.xml")
			.sortMembersEnabled(true)
		licenseHeaderFile("spotless/license_template.txt")
		formatAnnotations()
	}
}

jar {
    exclude("**/datagen/**")
	from(sourceSets.main.output)
    from(sourceSets.client.output)
}
